name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout aplicacao
        uses: actions/checkout@v4
        with:
          path: todo-app
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Executar testes unitarios
        working-directory: todo-app
        run: npm test

      - name: Verificar token do repositorio de testes
        env:
          INTEGRATION_TESTS_REPO_TOKEN: ${{ secrets.INTEGRATION_TESTS_REPO_TOKEN }}
        run: |
          if [ -z "$INTEGRATION_TESTS_REPO_TOKEN" ]; then
            echo "::error::Configure o secret INTEGRATION_TESTS_REPO_TOKEN com acesso de leitura a davisonalves/todo-integration-tests."
            exit 1
          fi

      - name: Checkout repositorio de testes de integracao
        id: checkout_integration
        uses: actions/checkout@v4
        with:
          repository: davisonalves/todo-integration-tests
          ref: master
          token: ${{ secrets.INTEGRATION_TESTS_REPO_TOKEN }}
          path: todo-integration-tests
          persist-credentials: false

      - name: Executar testes de integracao
        working-directory: todo-integration-tests
        run: npm run test

      - name: Encerrar containers de integracao
        if: always() && steps.checkout_integration.outcome == 'success'
        working-directory: todo-integration-tests
        run: docker compose -f compose.yaml down --volumes --remove-orphans
